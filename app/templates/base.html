<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PubMed Alert{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">📚 PubMed Alert</a>
    <span class="subtitle">{{ t("app_subtitle") }}</span>
    <nav class="top-nav">
      {% if current_user %}
        <a href="/">{{ t("nav_subscriptions") }}</a>
        <a href="/reading-list">{{ t("nav_reading_list") }}</a>
        <a href="/settings">{{ t("nav_settings") }}</a>
        <form method="post" action="/logout">
          <button class="link-button" type="submit">{{ t("nav_logout") }}</button>
        </form>
      {% else %}
        <a href="/login">{{ t("nav_login") }}</a>
      {% endif %}
    </nav>
    <div class="lang-switch">
      {% for code, name in langs %}
        <a href="/lang/{{ code }}" class="{{ 'active' if code == lang else '' }}">{{ name }}</a>
      {% endfor %}
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="app-footer">v{{ app_version }}</footer>
</body>
</html>
