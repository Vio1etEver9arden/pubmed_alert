{% extends "base.html" %}
{% block title %}{{ t("register_title") }} - PubMed Alert{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ t("register_title") }}</h1>
</div>

{% if error %}
<div class="banner warn">{{ t(error) }}</div>
{% endif %}

<div class="card">
  <form class="stack" method="post" action="/register">
    <label>{{ t("field_username_label") }}</label>
    <input type="text" name="username" required minlength="3" maxlength="20" pattern="[A-Za-z][A-Za-z0-9_]{2,19}" value="{{ username }}">
    <div class="hint">{{ t("field_username_hint") }}</div>

    <label>{{ t("field_email_label") }}</label>
    <input type="email" name="email" required value="{{ email }}">

    <label>{{ t("field_password_label") }}</label>
    <input type="password" name="password" required minlength="8">

    <label>{{ t("field_password_confirm_label") }}</label>
    <input type="password" name="password_confirm" required minlength="8">

    <label>{{ t("field_invite_code_label") }}</label>
    <input type="text" name="invite_code" required>
    <div class="hint">{{ t("field_invite_code_hint") }}</div>

    <div class="actions">
      <button class="btn" type="submit">{{ t("btn_register") }}</button>
    </div>
  </form>
</div>

<p><a href="/login">{{ t("link_to_login") }}</a></p>

{% endblock %}
