{% extends "base.html" %}
{% block title %}{{ t("register_verify_title") }} - PubMed Alert{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ t("register_verify_title") }}</h1>
</div>

<div class="banner ok">{{ t("register_verify_hint") }}</div>

{% if notice %}
<div class="banner ok">{{ t(notice) }}</div>
{% endif %}
{% if error %}
<div class="banner warn">{{ t(error) }}</div>
{% endif %}

<div class="card">
  <form class="stack" method="post" action="/register/verify">
    <input type="hidden" name="email" value="{{ email }}">
    <label>{{ t("field_verification_code_label") }}</label>
    <input type="text" name="code" required minlength="6" maxlength="6" pattern="[0-9]{6}" autofocus>

    <div class="actions">
      <button class="btn" type="submit">{{ t("btn_verify") }}</button>
    </div>
  </form>
</div>

<form method="post" action="/register/resend">
  <input type="hidden" name="email" value="{{ email }}">
  <button class="btn secondary small" type="submit">{{ t("btn_resend_code") }}</button>
</form>

{% endblock %}
