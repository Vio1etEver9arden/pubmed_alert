{% extends "base.html" %}
{% block title %}{{ t("reset_password_title") }} - PubMed Alert{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ t("reset_password_title") }}</h1>
</div>

{% if error %}
<div class="banner warn">{{ t(error) }}</div>
{% endif %}

<div class="card">
  <form class="stack" method="post" action="/reset-password">
    <label>{{ t("field_login_identifier_label") }}</label>
    <input type="text" name="identifier" required value="{{ identifier }}">

    <label>{{ t("field_verification_code_label") }}</label>
    <input type="text" name="code" required minlength="6" maxlength="6" pattern="[0-9]{6}">

    <label>{{ t("field_new_password_label") }}</label>
    <input type="password" name="new_password" required minlength="8">

    <label>{{ t("field_new_password_confirm_label") }}</label>
    <input type="password" name="new_password_confirm" required minlength="8">

    <div class="actions">
      <button class="btn" type="submit">{{ t("btn_reset_password") }}</button>
    </div>
  </form>
</div>

<p><a href="/login">{{ t("link_to_login") }}</a></p>

{% endblock %}
